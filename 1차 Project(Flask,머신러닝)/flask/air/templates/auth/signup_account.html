{% extends "base.html" %}
{% block content %}
<div class="main-visual-section">
  <div class="auth-container">
    <div class="step-indicator">
      <span class="step completed"></span>
      <span class="step completed"></span>
      <span class="step active"></span>
      <span class="step"></span>
    </div>

    <div class="auth-header">
      <h2><strong>계정 설정</strong></h2>
      <p>아이디와 비밀번호를 설정해 주세요</p>
    </div>

    <form method="post" class="auth-form">
      {{ form.csrf_token }}
      <div class="input-section">
        <label>아이디를 입력해 주세요</label>
        <div class="input-row">
          <div class="code-input-wrapper flex-grow">
            {{ form.username(id="username") }}
          </div>
          <button type="button" class="btn-resend" onclick="checkDuplicate()">중복 확인</button>
        </div>
        <div class="error-msg-container mini">
          <p class="error-msg" id="id-error"></p>
        </div>

        <label>비밀번호를 설정해 주세요</label>
        <div class="input-column">
          <div class="code-input-wrapper">
            {{ form.password1(id="password1") }}
          </div>
          <div class="error-msg-container mini">
            <p class="error-msg" id="pw-error"></p>
          </div>
        </div>

        <label>비밀번호를 한 번 더 입력해 주세요</label>
        <div class="input-column">
          <div class="code-input-wrapper">
            {{ form.password2(id="password2") }}
          </div>
          <div class="error-msg-container mini">
            <p class="error-msg" id="pw2-error"></p>
          </div>
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-submit">확인</button>
      </div>
    </form>
  </div>
</div>

<script>
  function checkDuplicate() {
    const usernameInput = document.getElementById('username');
    const errorMsg = document.getElementById('id-error');
    const username = usernameInput.value.trim();

    if (!username) {
        errorMsg.innerText = "아이디를 입력해 주세요.";
        errorMsg.style.color = "#e03131";
        return;
    }

    fetch("{{ url_for('auth.check_username') }}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token() }}" // Flask-WTF 사용 시 필수
        },
        body: JSON.stringify({ username: username })
    })
    .then(response => response.json())
    .then(data => {
        errorMsg.innerText = data.message;

        if (data.is_available) {
            errorMsg.style.color = "#1da1f2"; // 성공 시 하늘색 (#555와 잘 어울림)
            usernameInput.dataset.checked = "true"; // 중복 확인 완료 마킹
        } else {
            errorMsg.style.color = "#e03131"; // 에러 시 빨간색
            usernameInput.dataset.checked = "false";
        }
    })
    .catch(err => {
        console.error(err);
        errorMsg.innerText = "서버 통신 오류가 발생했습니다.";
    });
}
</script>

{% endblock %}
