{% extends "base.html" %}
{% block content %}
{% include "navbar.html" %}
<div class="main-visual-section">
    <div class="auth-container">
        <div class="auth-header text-center">
          <h2><strong>AIR Pro 구독</strong></h2>
          <p>AIR 서비스의 모든 기능을 제한 없이 이용하세요.</p>
        </div>

        <div class="payment-detail-card mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge rounded-pill bg-purple-light text-black">Pro Plan</span>
            <span class="text-black-50">1개월 구독</span>
          </div>
          <div class="price-section">
            <h3 class="display-6 fw-bold text-black mb-0">₩1,900 <small class="fs-6 text-black-50">/ 월</small></h3>
          </div>
          <hr class="my-4 border-secondary">
          <ul class="list-unstyled text-black-50 mb-0">
            <li><i class="bi bi-check2-circle me-2 text-black-50"></i>서울 전 지역 미세먼지 정밀 예측</li>
            <li><i class="bi bi-check2-circle me-2 text-black-50"></i>호흡기 건강 맞춤형 AI 가이드</li>
            <li><i class="bi bi-check2-circle me-2 text-black-50"></i>광고 없는 대시보드 이용</li>
          </ul>
        </div>

        <div class="payment-action">
          <div class="button-group d-flex justify-content-center">
            <button type="button" id="btn-payment" class="btn-outline-wide">결제하기</button>
          </div>
          <p class="mt-3 text-center text-black-50" style="font-size: 0.8rem;">
            <i class="bi bi-shield-check me-1"></i> KG이니시스 보안 결제가 적용됩니다.
          </p>
        </div>
    </div>
</div>

{% endblock %}

{% block script %}
<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
<script src="{{ url_for('static', filename='js/payment.js') }}"></script>
{% endblock %}
