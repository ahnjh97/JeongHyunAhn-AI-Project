{% extends "base.html" %}
{% block content %}
{% include "navbar.html" %}
<div class="main-visual-section">
  <div class="auth-container">
    <div class="step-indicator">
      <span class="step active"></span>
      <span class="step"></span>
      <span class="step"></span>
      <span class="step"></span>
    </div>

    <div class="auth-header">
      <h2><strong>회원 가입</strong></h2>
      <p>이메일 인증을 진행해 주세요</p>
    </div>

    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="input-section">
        <label for="email">이메일을 입력해 주세요</label>
        <div class="code-input-wrapper">
          <input type="email" name="email" id="email"
                 value="{{ email if email else '' }}"
                 style="letter-spacing: normal; font-size: 1rem;" required>
        </div>

        <div class="error-msg-container">
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <p class="error-msg {{ 'info-msg' if category == 'info' else '' }}">
                  {{ message }}
                </p>
              {% endfor %}
            {% endif %}
          {% endwith %}
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-outline-wide">인증 코드 전송</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
